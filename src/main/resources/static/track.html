<!DOCTYPE html>
<html>
<head>
    <title>Track Complaint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-5">
<button
    class="btn btn-danger float-end"
    onclick="logout()">
    Logout
</button>

<div class="mb-3">
    <a href="/index.html"
       class="btn btn-secondary">
        Back
    </a>
</div>

<h2>Track Your Complaint</h2>



<div class="mb-3">

    <input
        type="text"
        id="trackingId"
        class="form-control"
        placeholder="Enter Tracking ID">

</div>

<button
    class="btn btn-primary"
    onclick="trackIssue()">
    Track
</button>

<hr>

<div id="result"></div>

<script>

// Login Protection
const user = JSON.parse(
    localStorage.getItem("loggedUser")
);

if (!user) {
    window.location.href = "/login.html";
}

// Logout
function logout() {

    localStorage.removeItem("loggedUser");

    window.location.href = "/login.html";
}

// Track Complaint
function trackIssue() {

    const trackingId =
        document.getElementById("trackingId").value;

    if (!trackingId) {

        alert("Please enter Tracking ID");

        return;
    }

    fetch(
        `http://localhost:8081/api/reports/track/${trackingId}`
    )
    .then(res => res.json())
    .then(data => {

        if (!data || !data.trackingId) {

            document.getElementById("result").innerHTML =
                "<div class='alert alert-danger'>Tracking ID not found</div>";

            return;
        }

        document.getElementById("result").innerHTML = `

            <div class="card mt-3">

                <div class="card-body">

                    <h4>${data.category}</h4>

                    <p>
                        <b>Tracking ID:</b>
                        ${data.trackingId}
                    </p>

                    <p>
                        <b>Description:</b>
                        ${data.description}
                    </p>

                    <p>
                        <b>Status:</b>
                        ${data.status}
                    </p>

                    <p>
                        <b>Created At:</b>
                        ${data.createdAt}
                    </p>

                    <p>
                        <b>Latitude:</b>
                        ${data.latitude}
                    </p>

                    <p>
                        <b>Longitude:</b>
                        ${data.longitude}
                    </p>

                </div>

            </div>

        `;
    })
    .catch(error => {

        document.getElementById("result").innerHTML =
            "<div class='alert alert-danger'>Unable to fetch complaint details</div>";

        console.error(error);

    });
}

// Auto Track After Redirect
window.onload = function() {

    const params =
        new URLSearchParams(window.location.search);

    const trackingId =
        params.get("trackingId");

    if (trackingId) {

        document.getElementById("trackingId").value =
            trackingId;

        trackIssue();
    }
};

</script>

</body>
</html>
