<!DOCTYPE html>
<html>
<head>
    <title>Civic Issue Reporting Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        #map {
            height: 400px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="container mt-4">

<button class="btn btn-danger float-end"
        onclick="logout()">
    Logout
</button>
<div class="mb-3">
    <a href="/login.html"
       class="btn btn-secondary">
        Back
    </a>
    <div class="mb-3">

    <a href="/track.html"
       class="btn btn-info">
        Track Existing Complaint
    </a>

</div>
</div>


<h2>Civic Issue Reporting Portal</h2>

<h5>Select Location on Map</h5>

<div id="map"></div>

<form id="issueForm">

    <div class="mb-3">
        <label>Category</label>
        <input type="text"
               id="category"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label>Description</label>
        <textarea id="description"
                  class="form-control"
                  required></textarea>
    </div>

    <input type="hidden" id="latitude">
    <input type="hidden" id="longitude">

    <button type="submit"
            class="btn btn-primary">
        Submit Issue
    </button>

</form>

<p id="result" class="mt-3 text-success"></p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Login Check
const user = JSON.parse(
    localStorage.getItem("loggedUser")
);

if (!user) {
    window.location.href = "/login.html";
}

// Logout
function logout() {

    localStorage.removeItem("loggedUser");

    window.location.href = "/login.html";
}

// Map Setup
let map = L.map('map').setView([12.9716, 77.5946], 12);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19
    }
).addTo(map);

let marker;

// Select Location
map.on('click', function(e) {

    let lat = e.latlng.lat;
    let lng = e.latlng.lng;

    document.getElementById("latitude").value = lat;
    document.getElementById("longitude").value = lng;

    if (marker) {
        map.removeLayer(marker);
    }

    marker = L.marker([lat, lng]).addTo(map);
});

// Submit Complaint
document.getElementById("issueForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {

        category:
            document.getElementById("category").value,

        description:
            document.getElementById("description").value,

        latitude:
            parseFloat(
                document.getElementById("latitude").value
            ),

        longitude:
            parseFloat(
                document.getElementById("longitude").value
            )
    };

    const response = await fetch(
        "http://localhost:8081/api/reports/create",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        }
    );

    const result = await response.json();

    document.getElementById("result").innerHTML =
        "✅ Issue Created! Tracking ID: <b>" +
        result.trackingId +
        "</b><br>Redirecting to tracking page...";

    document.getElementById("result").innerHTML = `
        <div class="alert alert-success">

            <h5>Complaint Submitted Successfully!</h5>

            <p>
                Tracking ID:
                <b>${result.trackingId}</b>
            </p>

            <a
                href="/track.html?trackingId=${result.trackingId}"
                class="btn btn-primary">
                Track Complaint
            </a>

            <button
                class="btn btn-success ms-2"
                onclick="location.reload()">
                Raise Another Complaint
            </button>

        </div>
    `;

});

</script>

</body>
</html>
