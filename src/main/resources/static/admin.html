<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Civic Issues</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
<button class="btn btn-danger float-end"
        onclick="logout()">
    Logout
</button>
<div class="mb-3">
    <a href="/login.html"
       class="btn btn-secondary">
        Back
    </a>
</div>


<h2>Admin Dashboard - Civic Issues</h2>

<!-- Statistics Cards -->
<div class="row mb-4">

    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>Total Issues</h5>
                <h2 id="totalCount">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>Received</h5>
                <h2 id="receivedCount">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>In Progress</h5>
                <h2 id="progressCount">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <h5>Resolved</h5>
                <h2 id="resolvedCount">0</h2>
            </div>
        </div>
    </div>

</div>


<!-- Status Filter -->
<div class="mb-3">
    <label><b>Filter By Status</b></label>

    <select id="statusFilter" class="form-select" onchange="loadReports()">
        <option value="ALL">All</option>
        <option value="RECEIVED">Received</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="RESOLVED">Resolved</option>
    </select>
</div>

<div class="row mb-3">

    <div class="col-md-6">
        <input
            type="text"
            id="trackingSearch"
            class="form-control"
            placeholder="Enter Tracking ID (e.g. CIV-7b2cb3fd)">
    </div>

    <div class="col-md-2">
        <button
            class="btn btn-success"
            onclick="loadReports()">
            Search
        </button>
    </div>

</div>
<table class="table table-bordered table-striped">

    <thead>
        <tr>
            <th>ID</th>
            <th>Tracking ID</th>
            <th>Category</th>
            <th>Status</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="data"></tbody>

</table>

<script>
const user = JSON.parse(
	    localStorage.getItem("loggedUser")
	);

	if (!user) {

	    window.location.href = "/login.html";

	}

	if (user.role !== "ADMIN") {

	    alert("Access Denied");

	    window.location.href = "/login.html";

	}

function loadStats() {

    fetch("http://localhost:8081/api/reports/stats")
        .then(res => res.json())
        .then(data => {

            document.getElementById("totalCount").innerText = data.total;
            document.getElementById("receivedCount").innerText = data.received;
            document.getElementById("progressCount").innerText = data.inProgress;
            document.getElementById("resolvedCount").innerText = data.resolved;

        });
}

function loadReports() {

    fetch("http://localhost:8081/api/reports/all")
        .then(res => res.json())
        .then(data => {

            let rows = "";

            const selectedStatus =
                document.getElementById("statusFilter").value;

            data.forEach(r => {
            	const searchText =
            	    document.getElementById("trackingSearch")
            	    .value
            	    .trim()
            	    .toUpperCase();

            	if (
            		    searchText !== "" &&
            		    !r.trackingId.toUpperCase().includes(searchText)
            		) {
            		    return;
            		}

                rows += `
                <tr>

                    <td>${r.id}</td>

                    <td>${r.trackingId}</td>

                    <td>${r.category}</td>

                    <td>${r.status}</td>

                    <td>
                        <a
                            href="https://www.openstreetmap.org/?mlat=${r.latitude}&mlon=${r.longitude}&zoom=16"
                            target="_blank"
                            class="btn btn-info btn-sm">
                            View Map
                        </a>
                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm"
                            onclick="updateStatus('${r.trackingId}', 'IN_PROGRESS')">
                            In Progress
                        </button>

                        <button
                            class="btn btn-success btn-sm"
                            onclick="updateStatus('${r.trackingId}', 'RESOLVED')">
                            Resolve
                        </button>

                    </td>

                </tr>
                `;
            });

            document.getElementById("data").innerHTML = rows;

        });
}

function updateStatus(trackingId, status) {

    fetch(
        `http://localhost:8081/api/reports/update-status/${trackingId}?status=${status}`,
        {
            method: "PUT"
        }
    )
    .then(res => res.json())
    .then(data => {

        alert("Status updated to: " + data.status);

        loadReports();
        loadStats();

    });
}

loadStats();
loadReports();

</script>

</body>
</html>
